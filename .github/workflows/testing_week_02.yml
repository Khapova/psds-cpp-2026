name: Testing Tasks Week 02

env:
  WEEK: &week week_02

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Select tasks to test'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - swap_ptr
          - func_array
          - longest
          - last_of_us
          - little_big
          - pretty_array

  schedule:
    - cron: '59 20 23 10 *'  # UTC: 20:59 = 23:59 MSK 23 October

jobs:
  test:
    uses: ./.github/workflows/run_tests.yml
    with:
      week: *week
      task: ${{ github.event_name == 'schedule' && 'all' || inputs.task }}